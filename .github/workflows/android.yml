name: XMR Lab Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: APK variant to build
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchains
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Prepare optional release signing
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.XMRLAB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XMRLAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XMRLAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XMRLAB_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xmrlab-release.jks"
            echo "XMRLAB_RELEASE_STORE_FILE=$RUNNER_TEMP/xmrlab-release.jks" >> "$GITHUB_ENV"
            echo "XMRLAB_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "XMRLAB_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "XMRLAB_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No signing keystore configured; Gradle will produce an unsigned release APK."
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmr-lab-${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
