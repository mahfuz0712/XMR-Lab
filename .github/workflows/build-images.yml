name: Build guest images

# Builds the guest Debian rootfs + VM kernel (images/build-all.sh) and
# publishes the result as a new GitHub Release, so this doesn't have to be
# done on a local machine (WSL, etc). Manual trigger only -- this is a long,
# heavy, root-requiring build, not something to run on every push.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create and upload assets to (must not already exist)'
        required: true
        default: 'xmr-assets'
      skip_uml:
        description: 'Skip the UML kernel (needs the Android NDK; not used by the rootless engine)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build rootfs + kernel images
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          # debootstrap + kernel build + both tarball/image outputs need real
          # room; the hosted runner's default free space is too tight once
          # preinstalled toolchains we don't need are counted. Leave
          # /usr/local/lib/android alone when the NDK step below needs it --
          # deleting it here leaves the parent dir without permissions for
          # the (non-root) setup-android action to recreate it.
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache \
                      /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          if [ "${{ inputs.skip_uml }}" = "true" ]; then
            sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          fi
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap qemu-user-binfmt binfmt-support \
            libssl-dev libelf-dev bc flex bison pigz \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          # Some Ubuntu releases ship real qemu-*-static binaries under the
          # qemu-user-static package; others only have qemu-user-binfmt/
          # qemu-user, whose binary is just "qemu-aarch64" (no -static
          # suffix). Try the static package too, but don't fail if it's a
          # virtual/unavailable package there -- rootfs/build.sh only checks
          # for a binary literally named qemu-aarch64-static on PATH, so
          # make sure one exists either way.
          sudo apt-get install -y --no-install-recommends qemu-user-static || true
          if ! command -v qemu-aarch64-static >/dev/null 2>&1; then
            real=$(command -v qemu-aarch64 2>/dev/null || true)
            if [ -n "$real" ]; then
              sudo ln -sf "$real" /usr/local/bin/qemu-aarch64-static
            fi
          fi
          command -v qemu-aarch64-static

      - name: Set up Android NDK
        if: ${{ inputs.skip_uml == false }}
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;25.1.8937393'

      - name: Build images
        run: |
          if [ "${{ inputs.skip_uml }}" = "true" ]; then
            export SKIP_UML=1
          else
            export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/25.1.8937393"
          fi
          # invoked via `bash`, not as ./images/build-all.sh, because the
          # scripts aren't marked executable in git (100644) -- sudo's
          # "command not found" on a non-executable file is misleading.
          sudo -E bash images/build-all.sh

      - name: Show build output
        if: always()
        run: |
          find images/out -type f -exec ls -lh {} \; 2>/dev/null || true
          echo
          column -t -s"$(printf '\t')" images/out/artifacts.tsv 2>/dev/null || cat images/out/artifacts.tsv 2>/dev/null || true

      - name: Upload artifacts.tsv (for the manifest step, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-tsv
          path: images/out/artifacts.tsv
          if-no-files-found: ignore
          retention-days: 30

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd images/out
          files=()
          for f in chroot64-debian.tar.gz vm/Image vm/initrd.img vm/rootfs.imgz vm/rootfs.img; do
            [ -f "$f" ] && files+=("$f")
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No build artifacts found -- not creating a release." >&2
            exit 1
          fi
          gh release create "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --title "XMR Lab guest images (${{ inputs.release_tag }})" \
            --notes "Built by GitHub Actions from commit ${{ github.sha }} on branch ${{ github.ref_name }}." \
            "${files[@]}"

      - name: Print next step
        run: |
          echo "Release ${{ inputs.release_tag }} published."
          echo "Next: run images/publish.sh https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}"
          echo "(or hand the artifacts-tsv workflow artifact + the tag name to Claude to merge xmr_manifest.json)"
